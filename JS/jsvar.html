<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> java script variable</h1>

    <script>
        // var =  container which contains data or variables in java script
        var myNname="ABES";
        DOCUMENT.write(myNname);
        console.log(myNname);
        // js execution and scope global and local
        function demo(){
            var msg="thanks"//local
            console.log(msg);
        }
        demo();
        //var declaration using let and const
        let msg2="thanks again";
        console.log(msg2);

        const msg3="thanks to visit my page!";
        console.log(msg3);
    </script>
    
</body>
</html>
